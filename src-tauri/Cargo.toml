[package]
name = "sqlite-desktop"
version = "0.1.0"
description = "SQLite GUI 데스크탑 앱"
authors = ["you"]
edition = "2021"

[lib]
name = "sqlite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.42.0", features = ["bundled"] }
